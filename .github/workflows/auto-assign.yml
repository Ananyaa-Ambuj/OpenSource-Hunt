name: Auto Assign Issue

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  assign:
    if: |
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/assign')
    runs-on: ubuntu-latest

    steps:
      - name: Assign issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const username = context.payload.comment.user.login;

            // Get issue
            const { data: issue } =
              await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });

            // Check for "good first issue" label
            const isGoodFirstIssue = issue.labels.some(
              label =>
                typeof label.name === 'string' &&
                label.name.toLowerCase() === 'good first issue'
            );

            // Check if user is already assigned
            const alreadyAssigned = issue.assignees.some(
              assignee => assignee.login === username
            );

            if (alreadyAssigned) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `⚠️ @${username}, you are already assigned to this issue.`
              });

              return;
            }

            // Normal issue = only one assignee
            if (!isGoodFirstIssue && issue.assignees.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `⚠️ This issue is already assigned to ${
                  issue.assignees
                    .map(a => '@' + a.login)
                    .join(', ')
                }.`
              });

              return;
            }

            // Assign user
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              assignees: [username]
            });

            const message = isGoodFirstIssue
              ? `🎉 @${username} has been assigned to this **Good First Issue**!

              Multiple contributors can work on this issue.

              Please follow the contribution workflow:

              1. 🍴 Fork the repository
              2. 🌿 Create a new branch
              3. ✏️ Make your changes
              4. 💾 Commit your changes
              5. 🚀 Push your branch
              6. 🔄 Create a Pull Request

              Please link this issue in your Pull Request using:

              \`Closes #${issueNumber}\`

              Good luck and happy contributing! 🚀`
              : `🎉 Assigned to @${username}!

              Please follow the contribution workflow:

              1. 🍴 Fork the repository
              2. 🌿 Create a new branch
              3. ✏️ Make your changes
              4. 💾 Commit your changes
              5. 🚀 Push your branch
              6. 🔄 Create a Pull Request

              Please link this issue in your Pull Request using:

              \`Closes #${issueNumber}\`

              Good luck and happy contributing! 🚀`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: message
            });
