name: Assign Issue Reviewer

on:
  issues:
    types: [opened]

  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to assign a reviewer to"
        required: true
        type: string

permissions:
  issues: write
  contents: read

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest

    steps:
      - name: Assign reviewer
        uses: actions/github-script@v8
        with:
          script: |
            const issueNumber =
              context.eventName === 'workflow_dispatch'
                ? Number(context.payload.inputs.issue_number)
                : context.payload.issue.number;

            console.log(`Processing issue #${issueNumber}`);

            // Get issue
            const { data: issue } =
              await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });

            const issueCreator = issue.user.login;

            console.log(`Issue creator: ${issueCreator}`);

            // ------------------------------------------------
            // Get repository collaborators
            // ------------------------------------------------

            const collaborators =
              await github.paginate(
                github.rest.repos.listCollaborators,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 100
                }
              );

            console.log(
              `Found ${collaborators.length} collaborators`
            );

            // Only real users, not bots
            const validCollaborators =
              collaborators.filter(
                collaborator =>
                  collaborator.type === 'User'
              );

            if (validCollaborators.length === 0) {
              throw new Error(
                'No repository collaborators were found.'
              );
            }

            // ------------------------------------------------
            // Check whether issue creator is collaborator
            // ------------------------------------------------

            const creatorIsCollaborator =
              validCollaborators.some(
                collaborator =>
                  collaborator.login.toLowerCase() ===
                  issueCreator.toLowerCase()
              );

            let reviewer;

            // ------------------------------------------------
            // CASE 1:
            // Issue creator is a collaborator
            // ------------------------------------------------

            if (creatorIsCollaborator) {

              reviewer = issueCreator;

              console.log(
                `Issue creator is a collaborator.`
              );

              console.log(
                `Reviewer: @${reviewer}`
              );

            }

            // ------------------------------------------------
            // CASE 2:
            // Issue creator is NOT a collaborator
            // ------------------------------------------------

            else {

              const randomIndex =
                Math.floor(
                  Math.random() *
                  validCollaborators.length
                );

              reviewer =
                validCollaborators[randomIndex].login;

              console.log(
                `Issue creator is NOT a collaborator.`
              );

              console.log(
                `Random reviewer: @${reviewer}`
              );
            }

            // ------------------------------------------------
            // Prevent duplicate reviewer assignment
            // ------------------------------------------------

            const existingReviewerLabel =
              issue.labels.find(
                label =>
                  typeof label.name === 'string' &&
                  label.name.startsWith('reviewer:')
              );

            if (existingReviewerLabel) {

              console.log(
                `Reviewer already assigned: ${existingReviewerLabel.name}`
              );

              return;
            }

            // ------------------------------------------------
            // Create reviewer label
            // ------------------------------------------------

            const reviewerLabel =
              `reviewer:${reviewer}`;

            try {

              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: reviewerLabel
              });

            } catch (error) {

              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: reviewerLabel,
                description:
                  `Reviewer assigned to this issue: ${reviewer}`
              });
            }

            // ------------------------------------------------
            // Add reviewer label
            // ------------------------------------------------

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [reviewerLabel]
            });

            // ------------------------------------------------
            // Add comment
            // ------------------------------------------------

            const comment =
              creatorIsCollaborator
                ? `👀 **Reviewer Assigned**

              Reviewer: @${reviewer}

              The issue creator is a repository collaborator, so they have been assigned as the reviewer.`
                : `👀 **Reviewer Assigned**

              Reviewer: @${reviewer}

              The issue creator is not a repository collaborator, so a repository collaborator was randomly selected as the reviewer.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });

            console.log(
              `✅ Reviewer @${reviewer} assigned to issue #${issueNumber}`
            );
