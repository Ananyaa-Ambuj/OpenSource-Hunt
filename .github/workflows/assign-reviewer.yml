name: Assign PR Reviewer

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  assign-reviewer:

    runs-on: ubuntu-latest

    steps:

      - name: Find issue and assign reviewer
        uses: actions/github-script@v8

        with:
          script: |

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = context.payload.pull_request.number;

            console.log(`Processing PR #${pullNumber}`);


            // ==========================================
            // GET PR
            // ==========================================

            const { data: pr } =
              await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber
              });


            // ==========================================
            // FIND LINKED ISSUE
            // ==========================================

            const text =
              `${pr.title}\n${pr.body || ""}`;


            /*
             * Supports:
             *
             * Closes #16
             * Close #16
             * Closed #16
             * Fixes #16
             * Fix #16
             * Fixed #16
             * Resolves #16
             * Resolve #16
             */

            const regex =
              /(?:close[sd]?|fix(?:e[sd]?)|resolve[sd]?)\s+#(\d+)/gi;


            const issueNumbers = [];

            let match;


            while (
              (match = regex.exec(text)) !== null
            ) {

              issueNumbers.push(
                Number(match[1])
              );

            }


            if (issueNumbers.length === 0) {

              console.log(
                "No linked issue found."
              );

              return;

            }


            console.log(
              `Linked issues: ${issueNumbers.join(", ")}`
            );


            // ==========================================
            // GET REPOSITORY COLLABORATORS
            // ==========================================

            const collaborators =
              await github.paginate(
                github.rest.repos.listCollaborators,
                {
                  owner,
                  repo,
                  per_page: 100
                }
              );


            const users =
              collaborators.filter(
                user => user.type === "User"
              );


            if (users.length === 0) {

              core.setFailed(
                "No repository collaborators found."
              );

              return;

            }


            // ==========================================
            // PROCESS LINKED ISSUE
            // ==========================================

            for (
              const issueNumber of issueNumbers
            ) {

              const { data: issue } =
                await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber
                });


              const issueCreator =
                issue.user.login;


              console.log(
                `Issue #${issueNumber} created by @${issueCreator}`
              );


              // ========================================
              // CHECK WHETHER ISSUE CREATOR
              // IS A COLLABORATOR
              // ========================================

              let creatorIsCollaborator = false;


              try {

                await github.rest.repos.checkCollaborator({
                  owner,
                  repo,
                  username: issueCreator
                });

                creatorIsCollaborator = true;

              }
              catch (error) {

                if (error.status !== 404) {
                  throw error;
                }

              }


              let reviewer;


              // ========================================
              // CASE 1
              // ISSUE CREATOR IS COLLABORATOR
              // ========================================

              if (creatorIsCollaborator) {

                reviewer = issueCreator;

                console.log(
                  `Issue creator is collaborator: @${reviewer}`
                );

              }


              // ========================================
              // CASE 2
              // ISSUE CREATOR IS NOT COLLABORATOR
              // ========================================

              else {

                const availableReviewers =
                  users.filter(
                    user =>
                      user.login.toLowerCase() !==
                      pr.user.login.toLowerCase()
                  );


                if (
                  availableReviewers.length === 0
                ) {

                  console.log(
                    "No available collaborator can review this PR."
                  );

                  return;

                }


                const randomIndex =
                  Math.floor(
                    Math.random() *
                    availableReviewers.length
                  );


                reviewer =
                  availableReviewers[randomIndex].login;


                console.log(
                  `Random collaborator selected: @${reviewer}`
                );

              }


              // ========================================
              // DON'T REQUEST PR AUTHOR
              // TO REVIEW THEIR OWN PR
              // ========================================

              if (
                reviewer.toLowerCase() ===
                pr.user.login.toLowerCase()
              ) {

                console.log(
                  `@${reviewer} created the PR, so another reviewer is needed.`
                );


                const alternativeReviewers =
                  users.filter(
                    user =>
                      user.login.toLowerCase() !==
                      pr.user.login.toLowerCase()
                  );


                if (
                  alternativeReviewers.length === 0
                ) {

                  console.log(
                    "No alternative reviewer available."
                  );

                  return;

                }


                const randomIndex =
                  Math.floor(
                    Math.random() *
                    alternativeReviewers.length
                  );


                reviewer =
                  alternativeReviewers[
                    randomIndex
                  ].login;

              }


              // ========================================
              // CHECK EXISTING REVIEWERS
              // ========================================

              const requestedReviewers =
                await github.rest.pulls.listRequestedReviewers({
                  owner,
                  repo,
                  pull_number: pullNumber
                });


              const alreadyRequested =
                requestedReviewers.data.users.some(
                  user =>
                    user.login.toLowerCase() ===
                    reviewer.toLowerCase()
                );


              if (alreadyRequested) {

                console.log(
                  `@${reviewer} is already requested.`
                );

                return;

              }


              // ========================================
              // REQUEST REVIEW
              // ========================================

              await github.rest.pulls.requestReviewers({

                owner,
                repo,

                pull_number:
                  pullNumber,

                reviewers: [
                  reviewer
                ]

              });


              console.log(
                `✅ Review requested from @${reviewer}`
              );


              # ========================================
              # ADD COMMENT TO PR
              # ========================================

              await github.rest.issues.createComment({

                owner,
                repo,

                issue_number:
                  pullNumber,

                body:
                  `👀 **Reviewer Assigned**

                  @${reviewer} has been requested to review this Pull Request.

                  Linked issue: #${issueNumber}`

              });


              /*
               * We only need one reviewer.
               *
               * If a PR somehow references multiple
               * issues, stop after the first one.
               */

              break;

            }
